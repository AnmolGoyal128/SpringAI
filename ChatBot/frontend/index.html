<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomato Support - Food Delivery Assistant</title>
  <meta name="description" content="Instant customer support for Tomato food delivery orders, tracking, refunds and queries." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app-container">
    <!-- Chat Card -->
    <main class="chat-card" role="main">
      
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="header-left">
          <div class="brand-avatar">
            <span class="tomato-icon">🍅</span>
            <span class="status-indicator" title="Online"></span>
          </div>
          <div class="brand-info">
            <h1 class="brand-name">Tomato Support</h1>
            <p class="brand-status">
              <span class="live-dot"></span> Active Assistant &bull; Always online
            </p>
          </div>
        </div>
        <div class="header-right">
          <button id="clearChatBtn" class="header-btn" title="Clear Chat History" aria-label="Clear chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Quick Suggestion Chips -->
      <section class="suggestions-wrapper" aria-label="Suggested Questions">
        <div class="suggestions-track">
          <button class="chip" data-prompt="Where is my order?">🛵 Where is my order?</button>
          <button class="chip" data-prompt="I received the wrong food items.">🥡 Wrong items received</button>
          <button class="chip" data-prompt="Can I request a refund for my last order?">💰 Request refund</button>
          <button class="chip" data-prompt="What is your cancellation policy?">📋 Cancellation policy</button>
        </div>
      </section>

      <!-- Messages Stream -->
      <section class="messages-container" id="messagesContainer" aria-live="polite">
        <!-- Welcome Message -->
        <div class="message bot-message fade-in">
          <div class="msg-avatar">🍅</div>
          <div class="msg-bubble">
            <div class="msg-author">Tomato Support</div>
            <div class="msg-text">
              Hello! 👋 Welcome to Tomato Support. How can I assist you with your food order, delivery, or refund today?
            </div>
            <div class="msg-time" id="welcomeTime">Just now</div>
          </div>
        </div>

        <!-- Three-dot Thinking Indicator (Hidden by default) -->
        <div class="message bot-message typing-row" id="typingIndicator" style="display: none;">
          <div class="msg-avatar">🍅</div>
          <div class="msg-bubble thinking-bubble">
            <div class="thinking-label">Tomato Support is thinking</div>
            <div class="dot-flashing">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- Chat Input Area -->
      <footer class="chat-footer">
        <form id="chatForm" class="input-form">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Type your message about your order or refund..." 
            autocomplete="off" 
            required 
            aria-label="Type your message"
          />
          <button type="submit" id="sendBtn" class="send-button" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="footer-note">
          Powered by Tomato AI Assistant &bull; Spring Boot Backend
        </div>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
